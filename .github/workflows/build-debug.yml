name: Build Debug Module

on:
  workflow_dispatch:
  push:
    branches: [ master ]
    paths-ignore:
      - '**.md'

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ !startsWith(github.event.head_commit.message, '[skip ci]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: 'recursive'
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Gradle prebuild
        run: ./gradlew prebuild

      - name: Build debug module
        run: ./gradlew :zygote:assembleDebug

      - name: Upload debug module
        uses: actions/upload-artifact@v7
        with:
          name: hma-oss-debug-module
          path: zygote/build/outputs/magisk/debug/*.zip
